name: smartgn-telemetry
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: smartgn_telemetry
      POSTGRES_USER: smartgn_telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:?Set TELEMETRY_DB_PASSWORD}
    volumes: [processing-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U smartgn_telemetry']
      interval: 5s
      timeout: 3s
      retries: 30
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?Set INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: smartgn
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN}
    ports: ["127.0.0.1:18086:8086"]
    volumes: [influx-data:/var/lib/influxdb2]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1885:1883"]
    volumes: [./tools/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 20
  telemetry:
    build: .
    environment:
      TELEMETRY_DB: "Host=postgres;Database=smartgn_telemetry;Username=smartgn_telemetry;Password=${TELEMETRY_DB_PASSWORD:?Set TELEMETRY_DB_PASSWORD};Maximum Pool Size=32;Timeout=3;Command Timeout=5"
      PORT: "8085"
      GRPC_PORT: "9084"
      MQTT_URL: tcp://mqtt:1883
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: smartgn
      INFLUX_BUCKET: telemetry
      INSTALLATION_BASE_URL: ${INSTALLATION_BASE_URL:-http://host.docker.internal:8081}
      ALERTING_EVENTS_SINK_URL: ${ALERTING_EVENTS_SINK_URL:-http://host.docker.internal:8086/internal/v1/telemetry-events}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    ports: ["127.0.0.1:8085:8085", "127.0.0.1:9084:9084"]
    depends_on:
      influxdb: {condition: service_healthy}
      mqtt: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  influx-data:
  processing-data:
